<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>WebChat</title><link rel="icon" type="image/png" href="chat.png"><meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --wa-green:#00a884;
  --bg:#f0f2f5;}

*{box-sizing:border-box}

body{
  margin:0;
  height:100vh;
  background:var(--bg);
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

.card{
  background:#fff;
  width:100%;
  max-width:380px;
  padding:32px 26px;
  border-radius:12px;
  box-shadow:0 4px 20px rgba(0,0,0,.08);
  text-align:center;
  position:relative;
}

.logo{
  font-size:26px;
  font-weight:700;
  color:var(--wa-green);
  margin-bottom:6px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

/* Info User dari Multi User System */
#multiUserInfo {
  background: #e8f5e9;
  border: 1px solid #c8e6c9;
  border-radius: 8px;
  padding: 12px;
  margin-bottom: 15px;
  font-size: 14px;
  animation: fadeIn 0.5s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}

.user-info-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.user-label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 500;
}

.user-label i {
  color: #4caf50;
}

.logout-btn {
  position: absolute;
  top: 20px;
  right: 20px;
  background: transparent;
  border: 1px solid var(--wa-green);
  color: var(--wa-green);
  border-radius: 8px;
  padding: 2px 8px;
  font-size: 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all 0.2s ease;
  z-index: 10;
}

.logout-btn:hover {
  background: var(--wa-green);
  color: white;
  transform: translateY(-2px);
  box-shadow: 0 4px 8px rgba(0, 168, 132, 0.2);
}

.logout-btn:active {
  transform: translateY(0);
}

.session-info {
  font-size: 12px;
  color: #666;
  display: flex;
  align-items: center;
  gap: 5px;
  justify-content: center;
  padding-top: 5px;
  border-top: 1px solid #c8e6c9;
  margin-top: 8px;
}

.session-info i {
  color: #ff9800;
}

.subtitle{
  font-size:14px;
  color:#666;
  margin-bottom:24px
}

.input{
  width:100%;
  padding:14px 16px;
  margin-bottom:14px;
  border-radius:999px;
  border:1px solid #ddd;
  font-size:14px;
  outline:none
}
.input:focus{border-color:var(--wa-green)}

.btn{
  width:100%;
  height:46px;
  border-radius:999px;
  border:none;
  background:var(--wa-green);
  color:#fff;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px
}
.btn:disabled{opacity:.7;cursor:not-allowed}

.error{
  min-height:18px;
  color:#e53935;
  font-size:13px;
  margin-bottom:10px
}

.success{
  min-height:18px;
  color:#00a884;
  font-size:13px;
  margin-bottom:10px
}

.switch{
  margin-top:22px;
  font-size:14px;
  color:var(--wa-green);
  cursor:pointer
}
.switch:hover{text-decoration:underline}

.spinner{
  width:18px;
  height:18px;
  border:3px solid rgba(255,255,255,.4);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .7s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}

.password-strength{
  font-size:12px;
  margin:-8px 0 10px 12px;
  text-align:left;
  height:14px
}
.weak{color:#e53935}
.medium{color:#ff9800}
.strong{color:#4caf50}
</style>
</head>

<body>

<!-- Script Cek Auth dari Multi User System -->
<script>
// === AUTH CHECK FOR MULTI USER SYSTEM ===
(function checkMultiUserAuth() {
    // Cek session dari index.html
    const isLoggedIn = sessionStorage.getItem('fileExplorerLoggedIn');
    const loginTime = parseInt(sessionStorage.getItem('loginTime') || '0');
    const currentTime = Date.now();
    const sessionDuration = 8 * 60 * 60 * 1000; // 8 jam
    
    // Jika belum login atau session expired, redirect ke index.html
    if (!isLoggedIn || (currentTime - loginTime) > sessionDuration) {
        // Clear session
        sessionStorage.removeItem('fileExplorerLoggedIn');
        sessionStorage.removeItem('loginTime');
        sessionStorage.removeItem('username');
        sessionStorage.removeItem('targetPage');
        
        // Redirect ke index.html
        window.location.href = 'index.html';
        return false;
    }
    
    // Dapatkan username dari session
    const username = sessionStorage.getItem('username');
    const targetPage = sessionStorage.getItem('targetPage');
    
    // Jika user login dengan username lain selain 'mylove'
    if (username !== 'mylove') {
        alert(`Anda login sebagai ${username}.\nHanya user "mylove" yang bisa mengakses halaman chat.\n\nAnda akan diarahkan ke halaman ${targetPage || 'index.html'}`);
        window.location.href = targetPage || 'index.html';
        return false;
    }
    
    console.log(`User ${username} authenticated for mylove`);    return true;
})();
</script>

<div class="card">
  <div class="logo">
    <span>WebChat</span>
  </div>
  
  <!-- Tombol Logout ke index.html (Hanya satu tombol) -->
  <button class="logout-btn" id="logoutBtn" onclick="logoutToIndex()" title="Kembali ke Login Multi User">
    <i class="fas fa-sign-out-alt"></i> Logout
  </button>
  
  <!-- Info User dari Login Multi User -->
  <div id="multiUserInfo">
    <div class="user-info-row">
    </div>
    <div class="session-info">
      <i class="fas fa-clock"></i>
      <span>Session aktif - Aplikasi WebChat</span>
    </div>
  </div>
  
  <div class="subtitle" id="title">Masuk ke akun MyLove</div>

  <div id="message"></div>

  <input class="input" id="loginId" placeholder="Username atau Email">
  <input class="input" id="username" placeholder="Username" style="display:none">
  <input class="input" id="email" placeholder="Email" style="display:none">
  <input class="input" id="password" type="password" placeholder="Kata sandi">
  <div class="password-strength" id="passwordStrength"></div>

  <button class="btn" id="submitBtn">
    <span id="btnText">MASUK</span>
  </button>

  <div class="switch" id="switch">Belum punya akun? Daftar</div>
</div>

<!-- Tambahkan Font Awesome untuk ikon -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
import {
  getFirestore,
  doc,
  setDoc,
  collection,
  query,
  where,
  getDocs
} from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

/* FIREBASE CONFIG - PASTIKAN SESUAI DENGAN PROJECT ANDA */
const firebaseConfig = {
  apiKey: "AIzaSyAEbWsT4pkpvdgTtb5AR8haclGirIfKgEw",
  authDomain: "webchat-saya.firebaseapp.com",
  projectId: "webchat-saya",
  storageBucket: "webchat-saya.firebasestorage.app",
  messagingSenderId: "57188543238",
  appId: "1:57188543238:web:a6729df4e05ce462960c87"
};

// Inisialisasi Firebase
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ELEMENT */
const loginId = document.getElementById("loginId");
const usernameInput = document.getElementById("username");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const submitBtn = document.getElementById("submitBtn");
const btnText = document.getElementById("btnText");
const messageEl = document.getElementById("message");
const switchBtn = document.getElementById("switch");
const titleEl = document.getElementById("title");
const passwordStrengthEl = document.getElementById("passwordStrength");
const loggedInUsernameEl = document.getElementById("loggedInUsername");
const multiUserInfoEl = document.getElementById("multiUserInfo");
const logoutBtn = document.getElementById("logoutBtn");

let signup = false;
let loading = false;

/* === MULTI USER SYSTEM FUNCTIONS === */

// Fungsi untuk menampilkan info user dari login multi user
function showMultiUserInfo() {
    const username = sessionStorage.getItem('username');
    
    if (username && loggedInUsernameEl && multiUserInfoEl) {
        loggedInUsernameEl.textContent = username;
        multiUserInfoEl.style.display = 'block';
        
        // Update teks tombol logout
        logoutBtn.innerHTML = `<i class="fas fa-sign-out-alt"></i> Logout (${username})`;
    } else {
        // Sembunyikan info jika tidak ada username
        if (multiUserInfoEl) {
            multiUserInfoEl.style.display = 'none';
        }
    }
}

// Fungsi logout dari semua sistem (Multi User + Firebase)
window.logoutToIndex = function() {
    if (confirm("Apakah Anda yakin ingin logout dari sistem?")) {
        // Sign out dari Firebase terlebih dahulu
        signOut(auth).then(() => {
            // Clear semua session storage
            sessionStorage.removeItem('fileExplorerLoggedIn');
            sessionStorage.removeItem('loginTime');
            sessionStorage.removeItem('username');
            sessionStorage.removeItem('targetPage');
            
            // Redirect ke index.html
            window.location.href = 'index.html';
        }).catch((error) => {
            console.error("Firebase logout error:", error);
            // Tetap clear session dan redirect meski ada error Firebase
            sessionStorage.removeItem('fileExplorerLoggedIn');
            sessionStorage.removeItem('loginTime');
            sessionStorage.removeItem('username');
            sessionStorage.removeItem('targetPage');
            window.location.href = 'index.html';
        });
    }
};

/* UTIL FUNCTIONS */
function sanitize(text){
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function checkPasswordStrength(pass){
  if(!pass) return {level: 0, text: "", class: ""};
  let strength = 0;
  if(pass.length >= 8) strength++;
  if(/[A-Z]/.test(pass)) strength++;
  if(/[0-9]/.test(pass)) strength++;
  if(/[^A-Za-z0-9]/.test(pass)) strength++;
  
  return {
    level: strength,
    text: strength < 2 ? "Lemah" : strength < 4 ? "Sedang" : "Kuat",
    class: strength < 2 ? "weak" : strength < 4 ? "medium" : "strong"
  };
}

const isEmail = s => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s);

async function findEmailByUsername(u){
  try{
    const q = query(collection(db, "usernames"), where("username", "==", u));
    const s = await getDocs(q);
    return s.empty ? null : s.docs[0].data().email;
  } catch(error){
    console.error("Error finding email:", error);
    return null;
  }
}

async function checkUsernameExists(u){
  try{
    const q = query(collection(db, "usernames"), where("username", "==", u));
    const s = await getDocs(q);
    return !s.empty;
  } catch(error){
    console.error("Error checking username:", error);
    return false;
  }
}

/* PASSWORD STRENGTH CHECKER */
passwordInput.addEventListener("input", function(){
  if(!signup) return;
  const pass = this.value;
  const strength = checkPasswordStrength(pass);
  if(pass.length === 0){
    passwordStrengthEl.textContent = "";
  } else {
    passwordStrengthEl.textContent = `Kekuatan kata sandi: ${strength.text}`;
    passwordStrengthEl.className = `password-strength ${strength.class}`;
  }
});

/* AUTH STATE LISTENER */
onAuthStateChanged(auth, async user => {
  if(user && !signup) {
    console.log("User logged in to Firebase, redirecting to chat...");
    location.href = "love.html";
  }
});

/* UI FUNCTIONS */
function setLoading(v){
  loading = v;
  submitBtn.disabled = v;
  if(v){
    btnText.textContent = "Memproses...";
    submitBtn.insertAdjacentHTML("afterbegin", "<div class='spinner'></div>");
  } else {
    submitBtn.querySelector(".spinner")?.remove();
    btnText.textContent = signup ? "Daftar" : "Masuk ke MyLove"; 
  }
}

function showMessage(text, isError = true){
  messageEl.textContent = text;
  messageEl.className = isError ? "error" : "success";
}

/* SWITCH MODE */
switchBtn.onclick = () => {
  if(loading) return;
  signup = !signup;
  showMessage("");
  loginId.value = usernameInput.value = emailInput.value = passwordInput.value = "";
  passwordStrengthEl.textContent = "";
  
  if(signup){
    titleEl.textContent = "Buat akun MyLove baru";
    loginId.style.display = "none";
    usernameInput.style.display = "block";
    emailInput.style.display = "block";
    btnText.textContent = "Daftar";
    switchBtn.textContent = "Sudah punya akun? Masuk";
    setTimeout(() => usernameInput.focus(), 100);
  } else {
    titleEl.textContent = "Masuk ke akun MyLove";
    loginId.style.display = "block";
    usernameInput.style.display = "none";
    emailInput.style.display = "none";
    btnText.textContent = "Masuk ke MyLove";
    switchBtn.textContent = "Belum punya akun? Daftar";
    setTimeout(() => loginId.focus(), 100);
  }
};

/* AUTH HANDLER */
async function handleAuth(){
  if(loading) return;
  setLoading(true);
  showMessage("");

  try{
    if(signup){
      // VALIDASI SIGNUP
      if(!usernameInput.value || !emailInput.value || !passwordInput.value){
        throw "Lengkapi semua data";
      }

      const usernameTrimmed = usernameInput.value.trim();
      const emailTrimmed = emailInput.value.trim();
      const passwordTrimmed = passwordInput.value;

      if(usernameTrimmed.length < 3){
        throw "Username minimal 3 karakter";
      }

      if(usernameTrimmed.length > 20){
        throw "Username maksimal 20 karakter";
      }

      if(!isEmail(emailTrimmed)){
        throw "Format email tidak valid";
      }

      if(passwordTrimmed.length < 6){
        throw "Password minimal 6 karakter";
      }

      // CEK USERNAME DUPLIKAT
      const usernameExists = await checkUsernameExists(usernameTrimmed);
      if(usernameExists){
        throw "Username sudah digunakan";
      }

      console.log("Creating user account...");
      
      // BUAT AKUN DI FIREBASE AUTH
      const userCredential = await createUserWithEmailAndPassword(
        auth,
        emailTrimmed,
        passwordTrimmed
      );
      
      const user = userCredential.user;
      console.log("User created:", user.uid);

      // SIMPAN USERNAME KE FIRESTORE
      await setDoc(doc(db, "usernames", user.uid), {
        username: usernameTrimmed,
        email: emailTrimmed,
        createdAt: new Date().toISOString(),
        multiUserSystem: true // Flag untuk menandai dari sistem multi user
      });
      
      console.log("Username saved to Firestore");
      
      // LOGOUT SETELAH SIGNUP AGAR TIDAK OTOMATIS LOGIN
      await signOut(auth);
      console.log("Signed out after registration");

      // SWITCH KE MODE LOGIN
      signup = false;
      loginId.value = "";
      usernameInput.value = "";
      emailInput.value = "";
      passwordInput.value = "";
      
      // UPDATE UI KE MODE LOGIN
      titleEl.textContent = "Masuk ke akun MyLove";
      loginId.style.display = "block";
      usernameInput.style.display = "none";
      emailInput.style.display = "none";
      btnText.textContent = "Masuk ke MyLove";
      switchBtn.textContent = "Belum punya akun? Daftar";
      passwordStrengthEl.textContent = "";
      
      // TAMPILKAN PESAN SUKSES
      showMessage(`Akun ${usernameTrimmed} berhasil dibuat! Silakan login.`, false);
      setLoading(false);
      
      // FOKUS KE INPUT LOGIN
      setTimeout(() => loginId.focus(), 100);

    } else {
      // LOGIN
      let id = loginId.value.trim();
      if(!id || !passwordInput.value){
        throw "Lengkapi data";
      }

      let mail = isEmail(id) ? id : await findEmailByUsername(id);
      if(!mail){
        throw "Akun tidak ditemukan";
      }

      console.log("Logging in with email:", mail);
      
      await signInWithEmailAndPassword(
        auth,
        mail,
        passwordInput.value
      );
      
      console.log("Login successful, redirecting to chat...");
      // Redirect akan dilakukan otomatis oleh onAuthStateChanged
    }
  } catch(error) {
    console.error("Auth error:", error);
    
    // Tangani error spesifik Firebase
    let errorMessage = "Proses gagal";
    
    if(error.code){
      switch(error.code){
        case 'auth/email-already-in-use':
          errorMessage = "Email sudah digunakan";
          break;
        case 'auth/invalid-email':
          errorMessage = "Format email tidak valid";
          break;
        case 'auth/operation-not-allowed':
          errorMessage = "Registrasi tidak diizinkan";
          break;
        case 'auth/weak-password':
          errorMessage = "Password terlalu lemah";
          break;
        case 'auth/user-not-found':
          errorMessage = "Akun tidak ditemukan";
          break;
        case 'auth/wrong-password':
          errorMessage = "Password salah";
          break;
        case 'auth/too-many-requests':
          errorMessage = "Terlalu banyak percobaan. Coba lagi nanti";
          break;
        default:
          errorMessage = error.message || "Terjadi kesalahan";
      }
    } else if(typeof error === "string"){
      errorMessage = error;
    }
    
    showMessage(errorMessage);
    setLoading(false);
  }
}

/* EVENT LISTENERS */
submitBtn.onclick = handleAuth;

document.addEventListener("keydown", e => {
  if(e.key === "Enter") handleAuth();
});

// Inisialisasi saat halaman dimuat
document.addEventListener('DOMContentLoaded', function() {
  // Tampilkan info user dari multi user system
  showMultiUserInfo();
  
  // Tampilkan pesan selamat datang
  const multiUserUsername = sessionStorage.getItem('username');
  if (multiUserUsername === 'mylove') {
    showMessage(`Selamat datang, Silahkan login!.`, false);
  }
  
  // Auto-focus pada input yang sesuai
  setTimeout(() => {
    if (signup && usernameInput) {
      usernameInput.focus();
    } else if (loginId) {
      loginId.focus();
    }
  }, 100);
});
</script>

</body>
</html>
